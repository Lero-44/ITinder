<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Команда — Коллаборация</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/team-detail.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="teams.html" class="nav-logo">← Назад к поиску</a>
      <div class="nav-auth"><button id="loginBtn" class="btn">Войти</button></div>
    </div>
  </nav>

  <main class="container team-detail-page">
    <div id="teamContent" class="team-content"></div>
  </main>

  <script src="js/team-detail.js"></script>
  <script>
    let isAuthenticated = false;
    function toggleAuth() { isAuthenticated = !isAuthenticated; document.getElementById('loginBtn').textContent = isAuthenticated ? '👤 Выйти' : 'Войти'; }
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loginBtn').addEventListener('click', toggleAuth);
    });
  </script>
</body>
</html>
