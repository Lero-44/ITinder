<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коллаборация — Детали мероприятия</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="Коллаборация">
      </a>
      <div class="nav-auth">
        <button id="loginBtn" class="btn">Войти</button>
      </div>
    </div>
  </nav>

  <main class="container event-detail-page" style="padding-top: 40px;">
    <a href="index.html" class="back-link" style="color:var(--text-muted); text-decoration:none; display:inline-block; margin-bottom:20px;">← Назад к календарю</a>
    
    <div id="event-content" class="event-full-card" style="background:white; padding:30px; border-radius:20px; box-shadow:var(--shadow); margin-bottom:30px;">
      <!-- Контент загрузится через JS -->
    </div>

    <div class="chat-gate-box" style="background:white; padding:30px; border-radius:20px; box-shadow:var(--shadow); text-align:center;">
      <h3>💬 Командный чат</h3>
      <p>Обсудите детали и распределите роли с другими участниками</p>
      <div id="chatPreview" class="chat-preview-blur" style="background:#f1f5f9; padding:40px; border-radius:12px; margin-top:16px; filter:blur(2px);">
        <p>🔒 Чат доступен после входа</p>
      </div>
      <button id="loginToChat" class="btn" style="margin-top:16px;">Войти, чтобы написать</button>
    </div>
  </main>

  <script src="js/event.js"></script>
  <script>
    let isAuthenticated = false;
    function toggleAuth() {
      isAuthenticated = !isAuthenticated;
      updateInterface();
      if (isAuthenticated) {
        document.getElementById('loginBtn').textContent = '👤 Выйти';
        checkChatAccess();
      } else {
        document.getElementById('loginBtn').textContent = 'Войти';
        checkChatAccess();
      }
    }
    function checkChatAccess() {
      const chatBtn = document.getElementById('loginToChat');
      const chatBlur = document.getElementById('chatPreview');
      if (isAuthenticated) {
        if(chatBtn) chatBtn.style.display = 'none';
        if(chatBlur) {
          chatBlur.innerHTML = '<p style="color:var(--text-muted)">Сообщений пока нет. Будьте первым!</p>';
          chatBlur.style.filter = 'none';
        }
      }
    }
    function updateInterface() {
      const btn = document.getElementById('loginBtn');
      btn.textContent = isAuthenticated ? '👤 Выйти' : 'Войти';
      btn.onclick = toggleAuth;
    }
    document.addEventListener('DOMContentLoaded', updateInterface);
  </script>
</body>
</html>
