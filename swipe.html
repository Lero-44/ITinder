<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск команды — Коллаборация</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/swipe.css">
</head>
<body>
  <!-- Навигация -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">✨ Коллаборация</a>
      <div class="nav-auth">
        <button id="loginBtn" class="btn btn-outline" onclick="window.location.href='index.html'">На главную</button>
      </div>
    </div>
  </nav>

  <!-- Заголовок -->
  <header class="swipe-header container">
    <div>
      <h1 style="color:var(--primary)">🔍 Поиск команды</h1>
      <p style="color:var(--text-muted)">AI Hackathon 2026: найдите идеального напарника</p>
    </div>
  </header>

  <!-- Область карточек -->
  <main class="swipe-area">
    <div id="card-stack">
      <!-- Карточки генерируются JS -->
    </div>

    <!-- Кнопки управления -->
    <div class="swipe-controls">
      <button class="control-btn nope" onclick="swipeAction('left')">✖</button>
      <button class="control-btn super">⭐</button>
      <button class="control-btn like" onclick="swipeAction('right')">❤</button>
    </div>
  </main>

  <!-- Модальное окно Мэтча -->
  <div id="match-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="match-emoji">🎉</div>
      <h2>It's a Match!</h2>
      <p>Вы и <strong id="match-name">Алексей</strong> понравились друг другу</p>
      <div class="modal-buttons">
        <button class="btn btn-outline" onclick="closeMatchModal()">Продолжить поиск</button>
        <button class="btn" onclick="openChat()">💬 Написать сообщение</button>
      </div>
    </div>
  </div>

  <script src="js/swipe.js"></script>
</body>
</html>
